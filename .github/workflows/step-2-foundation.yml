name: Step 2 foundation

on:
  push:
    branches: ["architecture/step-2-foundation"]
  pull_request:
    branches: ["architecture/foundation-step-1"]
  merge_group:

jobs:
  step-2-foundation:
    name: Step 2 foundation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:governance
      - run: npm run validate:tokens
      - run: npm run validate:contracts
      - run: npm run validate:architecture
      - run: npm run validate:security
      - run: npm run validate:accessibility
      - run: npm run typecheck
      - run: npm run test:core
      - run: npm run build
      - run: npm run validate:build
