name: Step 2 foundation
on:
  push:
    branches: ["architecture/step-2-foundation"]
  pull_request:
    branches: ["architecture/foundation-step-1"]
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 tooling/governance/validate-governance.py
      - run: python3 tooling/tokens/validate_tokens.py
      - run: python3 tooling/contracts/validate_contracts.py
      - run: python3 tooling/architecture/validate_boundaries.py
      - run: python3 tooling/security/validate_runtime_safety.py
      - run: npm install
      - run: npm run check
