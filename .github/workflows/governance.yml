name: Governance Validation

on:
  push:
    branches: ["**"]
  pull_request:
  merge_group:

jobs:
  governance-validation:
    name: Governance validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate governance invariants
        run: python3 tooling/governance/validate-governance.py
