name: Repository Validation

on:
  push:
    branches:
      - main
      - architecture/foundation-step-1
      - architecture/step-2-foundation
  pull_request:
    branches:
      - main
      - architecture/foundation-step-1
  merge_group:

jobs:
  repository-validation:
    name: Repository validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and validate repository
        run: npm run build
